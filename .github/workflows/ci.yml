name: CI - Fraud Detection Pipeline

# Se déclenche à chaque push et à chaque pull request sur main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le dataset synthétique
        run: python data/generate_data.py

      - name: Entraîner le modèle (pour avoir un modèle frais à tester)
        run: |
          cd src
          python train.py

      - name: Lancer les tests automatisés
        run: pytest tests/ -v

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que l'image Docker se construit correctement
        run: docker build -t fraud-detection-api:ci .
